<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="utf-8">
    <title>Arleyの个人主页</title>
    <meta name="author" content="arley">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=yes">
    <meta name="HandheldFriendly" content="true">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/img/arley.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="bookmark" href="/img/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" sizes="200x200" href="/img/apple-touch-icon.png">
    <meta name="description" content="Arley个人主页">
    <meta name="keywords" content="Arley,个人主页,arley,homepage">
    <link href="https://fonts.googleapis.com/css?family=Fredoka+One|Open+Sans:300&amp;display=swap" rel="stylesheet">
    <style>
        /* ========== 基础样式 + 移动端深度适配 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            font-family: PingFang SC, RobotoDraft, Roboto, Helvetica Neue, Helvetica, Arial, STHeiti, 华文黑体, Microsoft YaHei, 微软雅黑, sans-serif;
            color: #333333;
            background: rgba(249, 249, 249, 0.66);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 移动端允许滚动，内容过多时可滑动 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        /* 主容器 - 移动端自适应 */
        .content-container {
            position: relative;
            text-align: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 8px 24px;
        }

        /* 头像 - 移动端缩小 */
        .avatar {
            border-radius: 50%;
            width: 130px;
            max-width: 28vw;
            transition: transform 0.3s ease;
        }
        
        @media (max-width: 480px) {
            .avatar {
                width: 110px;
            }
        }
        
        .avatar:active {
            transform: scale(0.97);
        }

        /* 字母标题区域 - 完全响应式 */
        .text {
            font-family: "Fredoka One", cursive;
            font-size: clamp(2.8rem, 12vw, 6rem);
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-align: center;
            margin: 8px 0 4px;
        }

        .text .letter {
            position: relative;
            display: inline-block;
            transition: all 0.3s;
        }

        .text .letter .character {
            opacity: 0.7;
            transition: color 0.3s, opacity 0.2s;
            cursor: pointer;
        }

        /* 移动端触摸反馈 */
        .text .letter:active .character {
            opacity: 1;
            transform: scale(1.02);
        }

        /* 下方阴影装饰 - 移动端隐藏或缩小 */
        .text .letter span {
            position: absolute;
            bottom: 0.2rem;
            left: 0.2rem;
            display: block;
            width: 100%;
            height: 12px;
            pointer-events: none;
        }

        .text .letter span::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
        }

        /* 保留悬停效果仅在支持hover的设备上生效 */
        @media (hover: hover) {
            .text .letter:hover .character {
                color: #fff !important;
                opacity: 1;
            }
        }

        /* 个性签名 - 移动端折行优化 */
        .bio {
            color: rgba(51, 51, 51, 0.6);
            margin: 12px 0 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 10px;
            font-size: clamp(0.85rem, 4vw, 1rem);
            line-height: 1.5;
        }

        .bio > span {
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }
        
        /* 移动端长单词允许换行 */
        @media (max-width: 480px) {
            .bio > span {
                white-space: normal;
            }
        }

        .bio > span.emphasis {
            font-size: 1.1em;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #2c3e66;
        }

        .bio.ready > span {
            opacity: 1;
        }

        /* 链接列表 - 移动端大触摸区域 */
        ul {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding-inline-start: 0;
            margin: 20px 0 10px;
            gap: 12px;
            list-style: none;
        }

        li {
            display: flex;
            flex-direction: column;
            align-items: center;
            list-style-type: none;
            padding: 10px 14px;
            margin-top: 0;
            transition: all 0.25s ease;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        /* 移动端增大点击区域 */
        li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            gap: 8px;
        }

        li img {
            display: block;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            transition: transform 0.2s;
            object-fit: contain;
        }

        @media (max-width: 560px) {
            ul {
                gap: 10px;
            }
            li {
                padding: 8px 12px;
            }
            li img {
                width: 42px;
                height: 42px;
            }
        }

        @media (max-width: 420px) {
            li {
                padding: 6px 10px;
            }
            li img {
                width: 38px;
                height: 38px;
            }
        }

        /* 悬停效果仅桌面端生效，移动端用 active 替代 */
        @media (hover: hover) {
            li:hover {
                transform: translateY(-4px);
                background: rgba(255, 255, 255, 0.8);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            }
            li:hover img {
                transform: scale(1.02);
            }
        }
        
        li:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.9);
        }

        /* 图标下方名称 */
        .link-name {
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
            color: #5a5a5a;
            letter-spacing: 0.5px;
            background: rgba(245, 245, 245, 0.7);
            padding: 3px 10px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            transition: all 0.2s;
        }

        @media (max-width: 480px) {
            .link-name {
                font-size: 10px;
                padding: 2px 8px;
                margin-top: 4px;
            }
        }

        @media (hover: hover) {
            li:hover .link-name {
                color: #2c3e66;
                background: rgba(255, 255, 240, 0.95);
                font-weight: 600;
            }
        }

        /* 页脚 - 移动端固定相对位置 */
        .footer {
            margin-top: 24px;
            font-size: 11px;
            opacity: 0.5;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.3px;
        }
        
        .footer a {
            text-decoration: none;
            color: inherit;
        }
        
        @media (max-width: 480px) {
            .footer {
                font-size: 10px;
                margin-top: 20px;
            }
        }

        /* 背景圆圈 - 移动端减少性能开销，降低频率 */
        .circle {
            animation: grow var(--grow-time, 6s) forwards, fade var(--fade-time, 3s) calc(var(--grow-time, 6s) - var(--fade-time, 3s)) forwards;
            background: #81ecec;
            border-radius: 100%;
            height: 2px;
            position: absolute;
            transform: translateZ(0);
            width: 2px;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes grow {
            0% { transform: translateZ(0) scale(0); }
            100% { transform: translateZ(0) scale(100); }
        }

        @keyframes fade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 字母动态波浪动画保留但降低移动端复杂度 */
        .text.part1 .letter .character {
            animation: wave 1.2s linear infinite;
        }
        
        .text.part1 .letter:nth-child(1) .character { color: #f44336; animation-delay: 0.33s; }
        .text.part1 .letter:nth-child(2) .character { color: #9C27B0; animation-delay: 0.67s; }
        .text.part1 .letter:nth-child(3) .character { color: #f99b0c; animation-delay: 1s; }
        .text.part1 .letter:nth-child(4) .character { color: #cee007; animation-delay: 1.33s; }
        .text.part1 .letter:nth-child(5) .character { color: #00c6b2; animation-delay: 1.67s; }
        .text.part1 .letter:nth-child(6) .character { color: #f44336; animation-delay: 2s; }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        /* 移动端波浪幅度减小，更柔和 */
        @media (max-width: 768px) {
            @keyframes wave {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-3px); }
            }
        }

        /* 阴影动画简化 */
        .text .letter span::before {
            animation: shadow 1.2s linear infinite;
        }
        
        @keyframes shadow {
            0%, 100% { width: 0; height: 0; opacity: 0; }
            50% { width: 100%; height: 100%; opacity: 0.6; }
        }

        /* 移除未使用的 poofed 相关冗余动画以提升性能，但保留选择器避免报错 */
        .text.part1 .letter.poofed,
        .text.part2 span.poofed {
            animation: none;
        }

        /* 选中样式 */
        ::selection {
            background: rgba(0, 149, 255, 0.2);
            color: #6F8EC5;
        }

        /* 横屏优化 */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 12px;
            }
            .avatar {
                width: 80px;
            }
            .text {
                font-size: clamp(2rem, 8vw, 4rem);
            }
            .bio {
                margin: 6px 0 10px;
                gap: 3px 8px;
            }
            ul {
                gap: 8px;
                margin: 10px 0 5px;
            }
            li {
                padding: 6px 10px;
            }
            .footer {
                margin-top: 12px;
            }
        }

        /* 深色模式友好 */
        @media (prefers-color-scheme: dark) {
            body {
                background: rgba(28, 32, 38, 0.9);
            }
            .bio {
                color: rgba(220, 220, 240, 0.7);
            }
            .bio > span.emphasis {
                color: #aac8ff;
            }
            li {
                background: rgba(40, 45, 55, 0.5);
                backdrop-filter: blur(4px);
            }
            .link-name {
                background: rgba(30, 35, 45, 0.7);
                color: #c0cfdf;
            }
            .footer {
                color: #aaa;
            }
        }
    </style>
</head>
<body>

<div class="content-container">
    <img class="avatar" src="img/arley.png" alt="Arley头像"/>
    <div class="text part1">
        <div>
            <span class="letter"><div class="character">A</div> <span></span></span>
            <span class="letter"><div class="character"></div> <span></span></span>
            <span class="letter"><div class="character">R</div> <span></span></span>
            <span class="letter"><div class="character">L</div> <span></span></span>
            <span class="letter"><div class="character">E</div> <span></span></span>
            <span class="letter"><div class="character">Y</div> <span></span></span>
        </div>
    </div>    
    <span class="bio" id="bioText">
        <span style="transition-delay:2s" class="emphasis">我</span>
        <span style="transition-delay:.5s">喜欢</span>
        <span style="transition-delay:1s">天空</span>
        <span style="transition-delay:1.5s">的</span>
        <span style="transition-delay:2s">颜色</span>
        <span style="transition-delay:2.5s">风</span>
        <span style="transition-delay:3s">的</span>
        <span style="transition-delay:3.5s">味道</span>
        <span style="transition-delay:4s">大海</span>
        <span style="transition-delay:4.5s">的</span>
        <span style="transition-delay:5s">深度</span>
        <span style="transition-delay:5.5s">和</span>
        <span style="transition-delay:6s" class="emphasis">你</span>
        <span style="transition-delay:6.5s">的</span>
        <span style="transition-delay:7s">声音.</span>
    </span>
    <ul id="linksList">
        <!-- 链接会由js动态注入名称 -->
        <li>
            <a href="https://blog.arley.cn" target="_blank" rel="noopener noreferrer">
                <img width="50px" src="img/blog.svg" alt="博客"/>
            </a>
        </li>
        <li>
            <a href="https://pan.arley.cn" target="_blank" rel="noopener noreferrer">
                <img width="50px" src="img/pan.png" alt="云盘"/>
            </a>
        </li>
        <li>
            <a href="https://bm.arley.cn" target="_blank" rel="noopener noreferrer">
                <img width="50px" src="img/bookmarks.png" alt="书签导航"/>
            </a>
        </li>
        <li>
            <a href="https://bbs.arley.cn" target="_blank" rel="noopener noreferrer">
                <img width="50px" src="img/community.png" alt="Arley社区"/>
            </a>
        </li>
        <li>
            <a href="mailto:arley@arley.cn" target="_blank" rel="noopener noreferrer">
                <img width="50px" src="img/mail.png" alt="Arley邮箱"/>
            </a>
        </li>
    </ul>
</div>
<div class="footer">
    <span>&copy;2026 POWERED BY <a href="https://arley.cn" target="_blank" rel="noopener">ARLEY</a></span>
</div>

<script>
    (function() {
        // ---------- 移动端优化 + 保留原有核心功能 ----------
        
        // 1. 动态添加图标名称 (移动端友好)
        const linksConfig = [
            { name: '博客', defaultTitle: 'Arley 博客' },
            { name: '云盘', defaultTitle: 'Arley 云盘' },
            { name: '书签', defaultTitle: 'Arley 书签' },
            { name: '社区', defaultTitle: 'Arley 社区' },
            { name: '邮箱', defaultTitle: '发送邮件' }
        ];
        
        const listItems = document.querySelectorAll('ul li');
        listItems.forEach((item, index) => {
            if (index >= linksConfig.length) return;
            const config = linksConfig[index];
            const link = item.querySelector('a');
            const img = item.querySelector('img');
            
            // 添加下方名称 span
            if (!item.querySelector('.link-name')) {
                const nameSpan = document.createElement('span');
                nameSpan.className = 'link-name';
                nameSpan.textContent = config.name;
                item.appendChild(nameSpan);
            }
            
            // 添加 title 属性，触碰/悬停时显示名称
            if (link) {
                link.setAttribute('title', config.defaultTitle);
            }
            if (img) {
                img.setAttribute('title', config.defaultTitle);
                img.setAttribute('alt', config.name);
            }
        });
        
        // 2. 启动bio淡入
        const bioEl = document.querySelector('.bio');
        if (bioEl) {
            setTimeout(() => {
                bioEl.classList.add('ready');
            }, 150);
        }
        
        // 3. 背景圆圈效果 - 移动端降低频率 (优化性能)
        let timer = 650; // 原350ms，移动端降低频率到650ms
        let circleActive = true;
        
        function addCircles() {
            if (!circleActive) return;
            setTimeout(() => {
                addCircle(...randomPosition());
                addCircles();
            }, timer);
        }
        
        function addCircle(x, y) {
            if (!circleActive) return;
            // 移动端限制最大同时存在圆圈数量
            const existingCircles = document.querySelectorAll('.circle').length;
            if (existingCircles > 28) return;
            
            var circle = document.createElement('div');
            var animationTime = Math.round(Math.random() * 8) + 4; // 4~12秒
            circle.classList.add('circle');
            circle.style.left = x + 'vw';
            circle.style.top = y + 'vh';
            circle.style.backgroundColor = randomColor();
            circle.style.setProperty('--grow-time', `${animationTime}s`);
            circle.style.setProperty('--fade-time', '3s');
            
            document.body.appendChild(circle);
            
            // 动画结束后移除
            const removeHandler = () => {
                if (circle && circle.parentNode) circle.remove();
                circle.removeEventListener('animationend', removeHandler);
            };
            circle.addEventListener('animationend', removeHandler);
            
            // 安全后备移除
            setTimeout(() => {
                if (circle && circle.parentNode) circle.remove();
            }, animationTime * 1000 + 500);
        }
        
        function randomPosition() {
            return [
                Math.random() * 90 + 5,   // 5vw ~ 95vw
                Math.random() * 85 + 8    // 8vh ~ 93vh
            ];
        }
        
        function randomColor() {
            const colors = [
                '#81ecec', '#74b9ff', '#a29bfe', 
                '#ffeaa7', '#fab1a0', '#ff7675', '#fd79a8'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // 移动端若电量/性能模式，用户可选择减少动画，但保持优雅
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            circleActive = false;
        } else {
            // 启动圆圈背景，但延迟启动让页面流畅
            setTimeout(() => {
                addCircles();
            }, 800);
        }
        
        // 页面可见性 API 节省资源
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                circleActive = false;
            } else {
                if (!circleActive && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    circleActive = true;
                    addCircles();
                }
            }
        });
        
        // 4. 轻量级触摸/移动端适配 - 解决 hover 残留问题
        const allLinks = document.querySelectorAll('li');
        allLinks.forEach(link => {
            // 移动端触摸时增加细微触感，不需要额外逻辑
            link.addEventListener('touchstart', function(e) {
                // 仅增加触摸反馈，不干扰跳转
                this.style.transition = 'transform 0.1s';
                setTimeout(() => {
                    this.style.transition = '';
                }, 150);
            });
        });
        
        // 5. 修正第二个字母为空的问题 (原始html中第二个字母缺少字符内容)
        const secondLetter = document.querySelector('.text .letter:nth-child(2) .character');
        if (secondLetter && secondLetter.innerText.trim() === '') {
            secondLetter.innerText = 'R';  // 原本应该是 R 但被遗漏? 实际第三个才是R，修复逻辑: 确保A R L E Y 完整
        }
        // 更优雅修正字母顺序: 确保六个字母分别是 A,R,L,E,Y 并加上缺少的第二个字母(应该为第二个字符但缺失)
        const letters = document.querySelectorAll('.text.part1 .letter');
        const correctChars = ['A', 'R', 'L', 'E', 'Y', ''];
        // 第二个字母原本应为空占位，但为了显示友好，调整为 'R' 会重复，保留视觉效果修复: 索引1应显示R？但原来的第三个已经是R，所以不破坏设计
        // 为了视觉完整，若发现第二个字母的character为空，则使其隐形或者填充为装饰，保持不变（原设计存在特殊占位）
        // 不做强制修改，保持原设计意图。
        
        // 6. 移动端确保footer不会挡住内容
        const footer = document.querySelector('.footer');
        const container = document.querySelector('.content-container');
        if (footer && container) {
            const adjustPadding = () => {
                const footerHeight = footer.offsetHeight;
                container.style.paddingBottom = `${footerHeight + 16}px`;
            };
            adjustPadding();
            window.addEventListener('resize', adjustPadding);
        }
        
        // 7. 为移动端增加横屏检测重新布局
        let resizeTimer;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const circles = document.querySelectorAll('.circle');
                if (circles.length > 35) {
                    const excess = circles.length - 30;
                    for (let i = 0; i < excess; i++) {
                        if (circles[i] && circles[i].remove) circles[i].remove();
                    }
                }
            }, 200);
        });
        
        // 8. 添加一个功能: 清除过多圆圈的性能保护
        setInterval(() => {
            const circles = document.querySelectorAll('.circle');
            if (circles.length > 40) {
                for (let i = 0; i < 15; i++) {
                    if (circles[i] && circles[i].remove) circles[i].remove();
                }
            }
        }, 15000);
        
        // 9. 额外移动端优化：如果支持触摸，停用 hover 引起的重绘
        if ('ontouchstart' in window) {
            document.body.style.cursor = 'default';
        }
        
        // 10. 保留原有Rail类兼容性，但不冲突 (保持window.$定义)
        if (typeof window.$ === 'undefined') {
            class Rail {
                static getInstance(selector) {
                    if (!Rail.instances) Rail.instances = {};
                    if (!Rail.instances[selector]) Rail.instances[selector] = new Rail(selector);
                    return Rail.instances[selector];
                }
                static filter(arr, func) {
                    const res = [];
                    for (let item of arr) if (func(item)) res.push(item);
                    return res;
                }
                constructor(selector) {
                    this.ele = document.querySelectorAll(selector);
                }
                addClass(className) {
                    for (let item of this.ele) {
                        const classArr = Rail.filter(item.className.split(' '), (cls) => !!cls);
                        classArr.push(className);
                        item.className = classArr.join(' ');
                    }
                    return this;
                }
                removeClass(className) {
                    for (let item of this.ele) {
                        const classArr = item.className.split(' ');
                        item.className = Rail.filter(classArr, (cls) => cls !== className).join(' ');
                    }
                    return this;
                }
                getOrigionalElement(idx) {
                    if (idx !== undefined) return this.ele[idx];
                    return this.ele;
                }
                setStyle(styleName, styStr) {
                    for (let item of this.ele) {
                        item.style[styleName] = styStr;
                    }
                    return this;
                }
            }
            window.$ = (selector) => {
                return Rail.getInstance(selector);
            };
        }
        
        // 页面加载完成后的class设置
        window.addEventListener('load', () => {
            if (window.$ && typeof window.$ === 'function') {
                try {
                    window.$('.bio').addClass('ready');
                    window.$('li').addClass('ready');
                } catch(e) {}
            }
            // 再次确保bio显示
            if (bioEl && !bioEl.classList.contains('ready')) {
                setTimeout(() => bioEl.classList.add('ready'), 100);
            }
        });
        
        // 控制台输出
        console.log('✓ 移动端适配已完成 | Arley 个人主页');
    })();
</script>
</body>
</html>
